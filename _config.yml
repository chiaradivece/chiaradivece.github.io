title: Chiara Di Vece
description: >-
  Chiara Di Vece, PhD. AI Lead at morph, building physical AI. PhD in Computer
  Science from UCL on real-time deep learning for fetal ultrasound navigation.
url: https://chiaradivece.github.io
baseurl: ""
lang: en

permalink: pretty
markdown: kramdown

# Ship .nojekyll so GitHub Pages serves the built site as-is
include:
  - .nojekyll

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .github
  - bin
  - .claude
  - .playwright-mcp

collections:
  redirects:
    output: true

plugins:
  - jekyll-sitemap
