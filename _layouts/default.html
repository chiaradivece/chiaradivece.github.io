<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip }}">
  <meta name="author" content="{{ site.data.profile.name }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description | strip }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ site.data.profile.photo | absolute_url }}">
  <meta name="twitter:card" content="summary">

  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f4f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0c0f13" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2310141a'/%3E%3Cpath d='M32 10 L13 47 A40 40 0 0 0 51 47 Z' fill='%23a8c8e8'/%3E%3C/svg%3E">

  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      document.documentElement.classList.add('js');
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  {%- if page.url == "/" %}
  <link rel="preload" as="image" href="{{ site.data.profile.cutout | relative_url }}" fetchpriority="high">
  {%- endif %}

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "{{ site.data.profile.name }}",
    "jobTitle": "{{ site.data.profile.role }}",
    "worksFor": { "@type": "Organization", "name": "{{ site.data.profile.company }}", "url": "{{ site.data.profile.company_url }}" },
    "alumniOf": ["University College London", "Politecnico di Milano", "University of Illinois Chicago"],
    "url": "{{ site.url }}",
    "image": "{{ site.data.profile.photo | absolute_url }}",
    "sameAs": [{% for l in site.data.profile.links %}"{{ l.url }}"{% unless forloop.last %}, {% endunless %}{% endfor %}]
  }
  </script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {{ content }}
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/scan.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/motion.js' | relative_url }}" defer></script>
</body>
</html>
