# News, newest first. The first item is shown large; the next four as a list;
# anything older goes under "Older news".
#
#   date:  free text shown as-is, e.g. "Jul 2026"
#   text:  one or two sentences
#   link:  optional URL (the LinkedIn or X post, a paper, a repo)
#   label: optional link text, defaults to "Read more"
#   photos: optional list of { src, thumb, w, h, alt, caption }; thumbnails open in a
#           photo viewer. caption is shown under the photo (defaults to the alt text)
#   photos_label: optional short label for the photo strip; the newest item with photos
#           among the first five is shown larger under the lead card

- date: Sep 2026
  text: >-
    My PhD in Computer Science from UCL has been officially awarded. The thesis is on
    real-time deep learning-based plane pose estimation and navigation in freehand fetal
    brain ultrasound.

- date: Jul 2026
  text: >-
    HyKey, our hyperspectral keypoint detection and matching method for minimally invasive
    surgery, was presented at IPCAI 2026 in Nagoya. The dataset and code are public.
  link: https://github.com/alexsaikia/HyKey-Hyperspectral-Keypoint-Detection
  label: Dataset and code

- date: Apr 2026
  text: >-
    Our multicentre benchmark dataset for landmark-based fetal ultrasound biometry is out in
    Scientific Reports, with open data and code.
  link: https://doi.org/10.1038/s41598-026-47854-3
  label: Read the paper

- date: Feb 2026
  text: >-
    I defended my PhD at UCL and passed with minor corrections. Thank you to my supervisors
    Dan Stoyanov and Francisco Vasconcelos, and to my examiners Ester Bonmati and George
    Mylonas.
  photos_label: My PhD viva at UCL
  photos:
