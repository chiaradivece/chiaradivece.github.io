- date: May 2025
  text: >-
    "Mismatched", our study of where image matching methods and benchmarks break down, is
    published in the ECCV 2024 Workshops proceedings.
  link: https://doi.org/10.1007/978-3-031-91989-3_8
  label: Read the paper

- date: Apr 2025
  text: >-
    Our robotic arm platform for multi-view image acquisition and 3D reconstruction in
    minimally invasive surgery is published in IEEE Robotics and Automation Letters.
  link: https://doi.org/10.1109/LRA.2025.3540529
  label: Read the paper

- date: Mar 2025
  text: >-
    I presented FETUS, our freehand ultrasound training system, at Innovation in Women's
    Health Tech 2025 in London. Our Women's Health Tech Grant project was also named one
    of the top 3.
