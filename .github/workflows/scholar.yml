name: Update Google Scholar stats

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scholar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch latest numbers
        run: python3 bin/update_scholar.py

      - name: Commit and redeploy if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain _data/scholar.yml)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/scholar.yml
          git commit -m "Update Google Scholar stats"
          git push
          # Pushes made with the workflow token don't trigger other workflows,
          # so start the deploy explicitly.
          gh workflow run deploy.yml --ref "${GITHUB_REF_NAME}"
